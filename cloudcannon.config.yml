_schema: _schema
source: .
paths:
  uploads: image/uploads
  static: ''
collections_config:
  pages:
    path: .
    glob:
      - '*.html'
    name: Pages
    icon: wysiwyg
    disable_url: false
    _enabled_editors:
      - visual
      - source
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  properties:
    path: properties
    glob:
      - '*/index.html'
    name: Properties
    icon: holiday_village
    disable_url: false
    _enabled_editors:
      - visual
      - source
    create: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  rentals:
    path: rentals
    glob:
      - '*/index.html'
    name: Rentals
    icon: home
    disable_url: false
    _enabled_editors:
      - visual
      - source
    create: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  blog:
    path: blog
    glob:
      - '*/index.html'
    name: Blog
    icon: article
    disable_url: false
    _enabled_editors:
      - visual
      - source
    create: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
collection_groups:
  - heading: Pages & Settings
    collections:
      - pages
  - heading: Listings
    collections:
      - properties
      - rentals
  - heading: Editorial
    collections:
      - blog
file_config:
  - glob: '**/*.html'
    _enabled_editors:
      - visual
      - source
timezone: Etc/UTC
version: 1
ssg: static
site:
  base_url: /
  timezone: Europe/Riga
routing:
  routes:
    - path: /
      file: index.html
    - path: /404.html
      file: 404.html
    - path: /about.html
      file: about.html
    - path: /blog.html
      file: blog.html
    - path: /contact.html
      file: contact.html
    - path: /faq.html
      file: faq.html
    - path: /price_plan.html
      file: price_plan.html
    - path: /properties.html
      file: properties.html
    - path: /rentals.html
      file: rentals.html
    - path: /service.html
      file: service.html
    - path: /team.html
      file: team.html
    - path: /property.html
      file: property.html
    - path: /rental.html
      file: rental.html
    - path: /property_details.html
      file: property_details.html
    - path: /property-detail-template.html
      file: property-detail-template.html
    - path: /single_blog.html
      file: single_blog.html
    - path: /properties/{slug}/
      file: properties/{slug}/index.html
    - path: /rentals/{slug}/
      file: rentals/{slug}/index.html
    - path: /blog/{slug}/
      file: blog/{slug}/index.html
build:
  install: ''
  command: ''
  output_path: .
