_schema: _schema
version: 1
ssg: none
timezone: Etc/UTC
source: .
paths:
  uploads: ./image/uploads
  static: .
  data: ./data
site:
  base_url: /
  timezone: Europe/Riga
_inputs:
  seo.title:
    type: text
    label: SEO Title
    comment: Appears in the <title> tag.
  seo.description:
    type: textarea
    label: Meta Description
    comment: Shown in search and social previews.
  locale:
    type: text
    hidden: true
  slug:
    type: text
    hidden: true
  form.id:
    type: text
    label: Form Identifier
    comment: Matches your CloudCannon inbox slug.
  form.endpoint:
    type: text
    label: Submission Endpoint
    comment: 'Use https://submit-form.cloudcannon.com/<INBOX-ID>'
  form.success_message:
    type: textarea
    label: Success Message
  form.error_message:
    type: textarea
    label: Error Message
  form.button_label:
    type: text
    label: Button Label
collections_config:
  pages:
    path: .
    glob:
      - '*.html'
    name: Pages
    icon: wysiwyg
    url: "/{filename}"
    disable_url: false
    create: false
    output: true
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source
  properties:
    path: properties
    glob:
      - '*/index.html'
    name: Properties
    icon: holiday_village
    disable_url: false
    create: true
    output: true
    new_item_extension: html
    new_item_template: properties/_defaults/index.html
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source
  rentals:
    path: rentals
    glob:
      - '*/index.html'
    name: Rentals
    icon: home
    disable_url: false
    create: true
    output: true
    new_item_extension: html
    new_item_template: rentals/_defaults/index.html
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source
  blog:
    path: blog
    glob:
      - '*/index.html'
    name: Blog
    icon: article
    disable_url: false
    create: true
    output: true
    new_item_extension: html
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source
data_config:
  navigation:
    path: data/navigation.json
    name: Navigation
    icon: format_list_bulleted
    format: json
    editor:
      preview: false
collection_groups:
  - heading: Pages & Settings
    collections:
      - pages
  - heading: Listings
    collections:
      - properties
      - rentals
  - heading: Editorial
    collections:
      - blog
file_config:
  - glob: '**/*.html'
    _enabled_editors:
      - visual
      - source
routing:
  routes:
    - path: /index.html
      file: index.html
    - path: /
      file: index.html
    - path: /404.html
      file: 404.html
    - path: /about.html
      file: about.html
    - path: /blog.html
      file: blog.html
    - path: /contact.html
      file: contact.html
    - path: /faq.html
      file: faq.html
    - path: /properties.html
      file: properties.html
    - path: /rentals.html
      file: rentals.html
    - path: /service.html
      file: service.html
    - path: /team.html
      file: team.html
    - path: /single_blog.html
      file: single_blog.html
    - path: /property_details.html
      file: property_details.html
    - path: /rental_details.html
      file: rental_details.html
    - path: /properties/{slug}/
      file: properties/{slug}/index.html
    - path: /rentals/{slug}/
      file: rentals/{slug}/index.html
    - path: /blog/{slug}/
      file: blog/{slug}/index.html
build:
  install: npm install
  command: npm run build
  output_path: dist







