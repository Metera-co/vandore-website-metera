version: 1

ssg: eleventy
source: .

site:
  base_url: /
  timezone: Europe/Riga

paths:
  static: .
  uploads: ./image/uploads
  data: ./content

editor:
  default: visual
  preview: true

structures:
  nav_item:
    label: Navigation Item
    icon: menu
    preview:
      - text: '{{ number }} {{ label }}'
    fields:
      - name: number
        type: text
        label: Order Number
      - name: label
        type: text
        label: Label
      - name: href
        type: text
        label: Link URL
        comment: Accepts relative or absolute URLs.
      - name: i18n
        type: text
        label: Translation Key
        comment: Optional translation key used by the site scripts.
      - name: iconClass
        type: text
        label: Icon Class
        comment: Optional icon override (defaults to the arrow icon).
  nav_contact_line:
    label: Contact Line
    icon: place
    preview:
      - text: '{{ text }}'
    fields:
      - name: text
        type: text
        label: Text
      - name: i18n
        type: text
        label: Translation Key
        comment: Optional translation key matching the site i18n keys.

collection_groups:
  - heading: Pages & Settings
    collections:
      - pages
  - heading: Listings
    collections:
      - properties
      - rentals
  - heading: Editorial
    collections:
      - blog

collections_config:
  pages:
    name: Pages
    icon: wysiwyg
    path: .
    glob:
      - '*.html'
    url: "/{filename}"
    output: true
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source

  properties:
    name: Properties
    icon: holiday_village
    path: content/properties
    glob:
      - '*.json'
    output: false
    create: true
    new_item_extension: json
    editor:
      default: data
      preview: true
    preview:
      url: "/properties/{{ slug }}/"
    _enabled_editors:
      - data
      - source
  rentals:
    name: Rentals
    icon: home
    path: rentals
    glob:
      - '*/index.html'
    output: true
    create: true
    new_item_extension: html
    editor:
      default: visual
      preview: true
    _enabled_editors:
      - visual
      - source

  blog:
    name: Blog
    icon: article
    path: content/blog
    glob:
      - '*.json'
    output: false
    create: true
    new_item_extension: json
    editor:
      default: data
      preview: true
    preview:
      url: "/blog/{{ slug }}/"
    _enabled_editors:
      - data
      - source
data_config:
  navigation:
    path: data/navigation.json
    name: Navigation
    icon: format_list_bulleted
    format: json
    editor:
      preview: false
    structures:
      primary:
        values:
          - structure: nav_item
      contact.lines:
        values:
          - structure: nav_contact_line
  page_data:
    path: content/pages
    name: Page Data
    icon: description
    format: json
    editor:
      preview: false
  property_data:
    path: content/properties
    name: Property Data
    icon: holiday_village
    format: json
    editor:
      preview: false
  rental_data:
    path: content/rentals
    name: Rental Data
    icon: home
    format: json
    editor:
      preview: false
  blog_data:
    path: content/blog
    name: Blog Data
    icon: article
    format: json
    editor:
      preview: false

file_config:
  - glob: '**/*.html'
    _enabled_editors:
      - visual
      - source

routing:
  routes:
    - path: /index.html
      file: index.html
    - path: /
      file: index.html
    - path: /404.html
      file: 404.html
    - path: /about.html
      file: about.html
    - path: /blog.html
      file: blog.html
    - path: /contact.html
      file: contact.html
    - path: /faq.html
      file: faq.html
    - path: /properties.html
      file: properties.html
    - path: /rentals.html
      file: rentals.html
    - path: /service.html
      file: service.html
    - path: /team.html
      file: team.html
    - path: /single_blog.html
      file: single_blog.html
    - path: /rental_details.html
      file: rental_details.html
    - path: /properties/{slug}/
      file: properties/{slug}/index.html
    - path: /rentals/{slug}/
      file: rentals/{slug}/index.html
    - path: /blog/{slug}/
      file: blog/{slug}/index.html

build:
  install: npm ci
  command: npm run build
  output_path: _site



